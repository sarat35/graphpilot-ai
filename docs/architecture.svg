<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .title { font: 700 42px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #526075; }
    .box { fill: #ffffff; stroke: #2f6fed; stroke-width: 3; rx: 18; }
    .ai { fill: #eef5ff; stroke: #2f6fed; stroke-width: 3; rx: 18; }
    .data { fill: #f1f8f3; stroke: #25824b; stroke-width: 3; rx: 18; }
    .obs { fill: #fff5e8; stroke: #c46b12; stroke-width: 3; rx: 18; }
    .label { font: 700 22px Arial, sans-serif; fill: #172033; text-anchor: middle; }
    .small { font: 16px Arial, sans-serif; fill: #526075; text-anchor: middle; }
    .arrow { stroke: #63718a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #c46b12; stroke-width: 3; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63718a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="80" class="title">BuySeconds — Hyderabad product-search architecture</text>
  <text x="80" y="115" class="subtitle">Bounded LangGraph workflow • approved sources • explainable top 10 • owner-triggered availability refresh</text>

  <rect x="80" y="250" width="230" height="130" class="box"/><text x="195" y="300" class="label">Next.js web app</text><text x="195" y="332" class="small">criteria + Supabase JWT</text>
  <rect x="375" y="250" width="230" height="130" class="box"/><text x="490" y="300" class="label">FastAPI</text><text x="490" y="332" class="small">JWT + Hyderabad validation</text>
  <rect x="670" y="235" width="255" height="160" class="ai"/><text x="798" y="283" class="label">LangGraph coordinator</text><text x="798" y="315" class="small">AI_ORCHESTRATION_MODEL_NAME</text><text x="798" y="342" class="small">gpt-5.4-mini</text>
  <rect x="995" y="110" width="250" height="145" class="ai"/><text x="1120" y="158" class="label">Agent 1: research</text><text x="1120" y="190" class="small">LangChain + Serper tool</text><text x="1120" y="218" class="small">5 approved sources</text>
  <rect x="995" y="330" width="250" height="145" class="ai"/><text x="1120" y="378" class="label">Agent 2: ranking</text><text x="1120" y="410" class="small">deterministic weights</text><text x="1120" y="438" class="small">top 10 results</text>
  <rect x="1310" y="110" width="210" height="145" class="box"/><text x="1415" y="158" class="label">Google results</text><text x="1415" y="190" class="small">Cars24 • CarWale</text><text x="1415" y="218" class="small">CarTrade • Spinny • OLX</text>
  <rect x="1310" y="330" width="210" height="145" class="data"/><text x="1415" y="378" class="label">Supabase</text><text x="1415" y="410" class="small">search + listing snapshots</text><text x="1415" y="438" class="small">saved availability</text>
  <rect x="670" y="570" width="255" height="125" class="obs"/><text x="798" y="618" class="label">LangSmith</text><text x="798" y="650" class="small">graph, model and tool traces</text>
  <rect x="1060" y="570" width="310" height="125" class="data"/><text x="1215" y="618" class="label">Saved listing refresh</text><text x="1215" y="650" class="small">only when owner opens it</text><text x="1215" y="677" class="small">404/410 → removed snapshot retained</text>

  <path d="M310 315 H375" class="arrow"/><path d="M605 315 H670" class="arrow"/><path d="M925 285 H995" class="arrow"/><path d="M1245 182 H1310" class="arrow"/>
  <path d="M1120 255 V330" class="arrow"/><path d="M1245 402 H1310" class="arrow"/><path d="M1415 475 V570 H1370" class="arrow"/>
  <path d="M798 395 V570" class="dash"/><path d="M1120 475 V570 H925" class="dash"/><path d="M1215 570 V475" class="arrow"/>
  <text x="1120" y="292" class="small">normalize + deduplicate, ≤100</text>
</svg>
